    <p>CZS: <span id="count">0</span> </p>

    <script>
        // 1. Kiểm tra xem trình duyệt có hỗ trợ localStorage không
        if (localStorage) {
            // 2. Lấy giá trị hiện tại từ localStorage, nếu chưa có thì mặc định là 0
            let pageReads = localStorage.getItem("page_view_count") || 0;

            // 3. Tăng số lần tải lên 1
            pageReads = parseInt(pageReads) + 1;

            // 4. Lưu lại giá trị mới vào localStorage
            localStorage.setItem("page_view_count", pageReads);

            // 5. Hiển thị số lần tải lên màn hình
            document.getElementById("count").innerText = pageReads;
        } else {
            console.log("Trình duyệt của bạn không hỗ trợ localStorage.");
        }
    </script>
